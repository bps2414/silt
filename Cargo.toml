[workspace]
resolver = "3"
members = ["crates/silt-core", "crates/silt-cli", "crates/silt-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
silt-core = { path = "crates/silt-core" }
# Rune is pre-release: bump this rev only on purpose, after reading its CHANGELOG.md.
rune = { git = "https://github.com/anomalyco/rune", rev = "250597b0a591881b5c0138370cbd5f405ed710db" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "250597b0a591881b5c0138370cbd5f405ed710db" }
rune-motion = { git = "https://github.com/anomalyco/rune", rev = "250597b0a591881b5c0138370cbd5f405ed710db" }
rune-i18n = { git = "https://github.com/anomalyco/rune", rev = "250597b0a591881b5c0138370cbd5f405ed710db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
