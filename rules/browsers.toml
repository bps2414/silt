# Browser caches. Sign-ins, history, passwords and bookmarks live elsewhere and are not touched.
# Close the browser first for the most space: files it holds open are skipped.

[[rule]]
id = "chrome-cache"
name = "Google Chrome cache"
group = "browsers"
paths = [
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\*\\Cache",
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\*\\Code Cache",
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\*\\GPUCache",
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\*\\DawnGraphiteCache",
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\*\\DawnWebGPUCache",
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\ShaderCache",
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\GrShaderCache",
  "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\GraphiteDawnCache",
]
safety = "safe"
note = "Pages load a little slower the first time. Sign-ins, history and passwords stay."
note-pt-BR = "As páginas carregam um pouco mais devagar na primeira vez. Logins, histórico e senhas ficam."

