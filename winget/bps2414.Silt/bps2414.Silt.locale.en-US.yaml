ShortDescription: See what fills your drive, and get the space back without deleting what you use.
Description: |-
  Silt scans an NTFS drive in seconds by reading its Master File Table, sorts every byte into
  categories, and offers four ways back to space: Shrink (Windows' transparent compression, nothing
  deleted, undo any time), Clean (caches that rebuild themselves), Trash (to the Recycle Bin) and
  Empty Recycle Bin.
